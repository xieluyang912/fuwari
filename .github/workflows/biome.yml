name: Code quality

on:
  push:
    branches: [ main ] # Adjust branches as needed
  pull_request:
    branches: [ main ] # Adjust branches as needed

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Biome
        uses: biomejs/setup-biome@f382a98e582959e6aaac8e5f8b17b31749018780 # v2.5.0
        with:
          version: latest
      - name: Run Biome
        # ⚠️ 一定要带上 ./scripts：astro check 与 astro build 都不编译
        # scripts/ 下的文件，那里写错了只有真正跑脚本时才会炸。
        # 把它们纳入 lint，这类问题才能在提交前被发现。
        run: biome ci ./src ./scripts --reporter=github
